  # Granite 30B SFT — 128k context, CP=4
  
  recipe:
    _target_: megatron.bridge.recipes.granite.granite_30b.granite_30b_finetune_config
    hf_model_path: /mnt/vast/proj/checkpoints/bathen/models/base/30b-soft-lc-512k-lr1e-4-merged-3-7-special
    tensor_model_parallel_size: 4
    pipeline_model_parallel_size: 8
    context_parallelism: 4
    sequence_parallelism: true
    seq_length: 131072
    micro_batch_size: 1
    global_batch_size: 32
    finetune_lr: 9.0e-6
    lr_warmup_iters: 50
    train_iters: 2000
    packed_sequence: true

  model:
    recompute_granularity: "full"
    recompute_method: "block"
    recompute_num_layers: 2
    calculate_per_token_loss: false # every sample weighted equally regardless of length

  ddp:
    use_distributed_optimizer: true

  dataset:
    seq_length: 131072
    super3_packed_sft_dir: /mnt/vast/proj/checkpoints/bathen/datasets/sft/granite_30b_tok_cp4-128k-special/splits
    packed_sequence_specs:
      packed_sequence_size: 131072
      pad_seq_to_mult: 8

  train:
    train_iters: 2000
    global_batch_size: 32

  checkpoint:
    save: /mnt/vast/proj/checkpoints/bathen/models/nemo_run/granite30b_sft_128k_special_s2
    load: /mnt/vast/proj/checkpoints/bathen/models/nemo_run/granite30b_sft_128k_special_s2
    save_interval: 250
    finetune: true

  logger:
    log_interval: 1
    wandb_project: "granite30b_sft_128k"
    wandb_exp_name: "granite30b_sft_128k_special_cp4_s2"
    wandb_entity: "bathen"