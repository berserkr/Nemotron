# Granite 30B SFT — 256k context, CP=2
#
# Hardware: 64 nodes x 4 GB200 = 256 GPUs
# Parallelism: TP=4, PP=4, CP=2, SP=True
# GPUs/model: 4*4*2 = 32, DP replicas: 8
# 64 layers / PP=4 = 16 layers per pipeline stage
# pad_seq_to_mult = CP * 2 = 4 (required for THD flash-attention)

recipe:
  _target_: megatron.bridge.recipes.granite.granite_30b.granite_30b_finetune_config
  tensor_model_parallel_size: 4
  pipeline_model_parallel_size: 4
  context_parallelism: 2
  sequence_parallelism: true
  seq_length: 262144
  micro_batch_size: 1
  global_batch_size: 64
  finetune_lr: 5.0e-6
  lr_warmup_iters: 50
  train_iters: 1000
  packed_sequence: true

dataset:
  seq_length: 262144
  packed_sft_dir: null
  packed_sequence_specs:
    packed_sequence_size: 262144
    pad_seq_to_mult: 4

train:
  train_iters: 1000
  global_batch_size: 64

checkpoint:
  save: /mnt/vast/proj/checkpoints/bathen/models/nemo_run/granite30b_sft_256k
  load: /mnt/vast/proj/checkpoints/bathen/models/nemo_run/granite30b_sft_256k
  save_interval: 100
  pretrained_checkpoint: /mnt/vast/proj/checkpoints/bathen/models/base/30b-soft-lc-512k-lr1e-4-merged-3-7
  finetune: false
