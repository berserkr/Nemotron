# Granite 8B SFT — 4k sanity check
#
# Hardware: 16 nodes x 4 GB200 = 64 GPUs
# Parallelism: TP=4, PP=1, CP=1, SP=True
# GPUs/model: 4, DP replicas: 16

recipe:
  _target_: megatron.bridge.recipes.granite.granite_8b.granite_8b_finetune_config
  pretrained_checkpoint: /mnt/vast/proj/checkpoints/bathen/models/base/granite-3.3-8b-base
  tensor_model_parallel_size: 4
  pipeline_model_parallel_size: 1
  context_parallelism: 1
  sequence_parallelism: true
  seq_length: 4096
  micro_batch_size: 1
  global_batch_size: 64
  finetune_lr: 5.0e-6
  lr_warmup_iters: 50
  train_iters: 100
  packed_sequence: true

model:
  recompute_granularity: "selective"

ddp:
  use_distributed_optimizer: true

dataset:
  seq_length: 4096
  #super3_packed_sft_dir: /mnt/vast/proj/checkpoints/bathen/datasets/sft/granite_30b_tok_cp4/splits
  #packed_sequence_specs:
  #  packed_sequence_size: 4096

train:
  train_iters: 100
  global_batch_size: 64

checkpoint:
  save: /mnt/vast/proj/checkpoints/bathen/models/nemo_run/granite8b_sft_4k
  load: /mnt/vast/proj/checkpoints/bathen/models/nemo_run/granite8b_sft_4k
  save_interval: 20
  pretrained_checkpoint: /mnt/vast/proj/checkpoints/bathen/models/base/granite-3.3-8b-base
  finetune: false