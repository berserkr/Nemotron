# Granite 8B SFT — 32k context, TP=4, CP=2
#
# Purpose: Test packing + TP + CP (isolate CP effect vs cp1 config)
# Hardware: 32 nodes x 4 GB200 = 128 GPUs
# Parallelism: TP=4, PP=1, CP=2, SP=True
# GPUs/model: 4*2 = 8, DP replicas: 16
# GBS=128: accumulation = 128 / 16 = 8

recipe:
  _target_: megatron.bridge.recipes.granite.granite_8b.granite_8b_finetune_config
  hf_model_path: /mnt/vast/proj/checkpoints/bathen/models/base/granite-4.1-8b-base-special
  tensor_model_parallel_size: 4
  pipeline_model_parallel_size: 1
  context_parallelism: 2
  sequence_parallelism: true
  seq_length: 32768
  micro_batch_size: 1
  global_batch_size: 64
  finetune_lr: 5.0e-6
  lr_warmup_iters: 40
  train_iters: 780
  packed_sequence: true

ddp:
  use_distributed_optimizer: true
  average_in_collective: false

dataset:
  seq_length: 32768
  super3_packed_sft_dir: /mnt/vast/proj/checkpoints/bathen/datasets/sft/granite8b-tulu3-32k-cp2/splits
  packed_sequence_specs:
    packed_sequence_size: 32768
    pad_seq_to_mult: 4

train:
  train_iters: 780
  global_batch_size: 64

validation:
  eval_interval: 100

checkpoint:
  save: /mnt/vast/proj/checkpoints/bathen/models/nemo_run/granite8b-tulu3-32k-cp2-stage1
  load: /mnt/vast/proj/checkpoints/bathen/models/nemo_run/granite8b-tulu3-32k-cp2-stage1
  save_interval: 100
  finetune: true

logger:
  log_interval: 1
  wandb_project: "granite_42_8b_sft_32k"
  wandb_exp_name: "granite8b-tulu3-32k-cp2-stage1"
  wandb_entity: "ai-models"
