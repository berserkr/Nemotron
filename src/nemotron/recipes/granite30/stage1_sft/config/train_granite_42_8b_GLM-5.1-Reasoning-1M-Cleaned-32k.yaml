# Granite 8B SFT — 32k context, CP=1 diagnostic run
#
# Purpose: Test if CP=2 at 128k is causing stop signal issues
# Hardware: 32 nodes x 4 GB200 = 128 GPUs
# Parallelism: TP=4, PP=1, CP=1, SP=True
# GPUs/model: 4*1*1 = 4, DP replicas: 32
# pad_seq_to_mult = CP * 2 = 2 (CP=1, so minimal padding)

recipe:
  _target_: megatron.bridge.recipes.granite.granite_8b.granite_8b_finetune_config
  hf_model_path: /mnt/vast/proj/checkpoints/bathen/models/base/granite-4.1-8b-base-special
  tensor_model_parallel_size: 4
  pipeline_model_parallel_size: 1
  context_parallelism: 1
  sequence_parallelism: true
  seq_length: 32768
  micro_batch_size: 1
  global_batch_size: 128
  finetune_lr: 1.0e-5
  lr_warmup_iters: 10
  train_iters: 540
  packed_sequence: true

ddp:
  use_distributed_optimizer: true

dataset:
  seq_length: 32768
  super3_packed_sft_dir: /mnt/vast/proj/checkpoints/bathen/datasets/sft/GLM-5.1-Reasoning-1M-Cleaned-32k/splits
  packed_sequence_specs:
    packed_sequence_size: 32768
    pad_seq_to_mult: 2

train:
  train_iters: 540
  global_batch_size: 128

validation:
  eval_interval: 5000

checkpoint:
  save: /mnt/vast/proj/checkpoints/bathen/models/nemo_run/granite_42_8b_sft_32k_cp1_diag
  load: /mnt/vast/proj/checkpoints/bathen/models/nemo_run/granite_42_8b_sft_32k_cp1_diag
  save_interval: 100
  finetune: true

logger:
  log_interval: 1
  wandb_project: "granite_42_8b_sft_32k"
  wandb_exp_name: "granite_42_8b_sft_32k_cp1_diagnostic"
  wandb_entity: "ai-models"
