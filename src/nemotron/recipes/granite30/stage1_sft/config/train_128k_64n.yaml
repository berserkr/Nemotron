# Granite 30B SFT — 128k context, CP=2
#
# Hardware: 64 nodes x 4 GB200 = 256 GPUs
# Parallelism: TP=4, PP=4, CP=2, SP=True
# GPUs/model: 4*4*2 = 32, DP replicas: 8
# 64 layers / PP=4 = 16 layers per pipeline stage
# Each GPU sees 64k tokens (128k / CP=2)
# pad_seq_to_mult = CP * 2 = 4

recipe:
  _target_: megatron.bridge.recipes.granite.granite_30b.granite_30b_finetune_config
  tensor_model_parallel_size: 4
  pipeline_model_parallel_size: 16
  context_parallelism: 2
  seq_length: 131072
  global_batch_size: 32

model:
  recompute_granularity: "full"
  recompute_method: "block"
  recompute_num_layers: 1

ddp:
  use_distributed_optimizer: true

dataset:
  super3_packed_sft_dir: /mnt/vast/proj/checkpoints/bathen/datasets/sft/granite_30b_tok_cp2/splits
  seq_length: 131072
  packed_sequence_specs:
    packed_sequence_size: 131072
    pad_seq_to_mult: 4

train:
  train_iters: 1000
  global_batch_size: 64

checkpoint:
  save: /mnt/vast/proj/checkpoints/bathen/models/nemo_run/granite30b_sft_128k
  load: /mnt/vast/proj/checkpoints/bathen/models/nemo_run/granite30b_sft_128k
  save_interval: 100
  pretrained_checkpoint: /mnt/vast/proj/checkpoints/bathen/models/base/30b-soft-lc-512k-lr1e-4-merged-3-7
  finetune: false
