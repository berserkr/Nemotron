# Granite MoE 3B SFT — 40k context, EP=4, CP=8
#
# Hardware: 8 nodes x 4 GB200 = 32 GPUs
# Parallelism: TP=1, PP=1, EP=4, CP=8, SP=False
# GPUs/model: 1*1*4*8 = 32, DP replicas: 1
# Per-GPU tokens: 40960/8 = 5120

recipe:
  _target_: megatron.bridge.recipes.granite.granite_moe_3b.granite_moe_3b_finetune_config
  hf_model_path: /mnt/vast/proj/checkpoints/bathen/models/base/granite-3.0-3b-a800m-base
  tensor_model_parallel_size: 1
  pipeline_model_parallel_size: 1
  expert_model_parallel_size: 8
  context_parallelism: 4
  sequence_parallelism: false
  seq_length: 40960
  micro_batch_size: 1
  global_batch_size: 32
  finetune_lr: 2.0e-6
  lr_warmup_iters: 100
  train_iters: 1000
  packed_sequence: true

model:
  rotary_base: 500000

ddp:
  use_distributed_optimizer: true
  check_for_nan_in_grad: false

dataset:
  seq_length: 40960
  super3_packed_sft_dir: /mnt/vast/proj/checkpoints/bathen/datasets/sft/granite_moe3b_tok_40k_pad256/splits
  packed_sequence_specs:
    packed_sequence_size: 40960
    pad_seq_to_mult: 256

train:
  train_iters: 1000
  global_batch_size: 32
  clip_grad: 1.0

checkpoint:
  save: /mnt/vast/proj/checkpoints/bathen/models/nemo_run/granite_moe3b_sft_40k
  load: /mnt/vast/proj/checkpoints/bathen/models/nemo_run/granite_moe3b_sft_40k
  save_interval: 250
  finetune: true
  most_recent_k: 3

logger:
  log_interval: 1
  wandb_project: "granite_moe3b_sft_40k"
  wandb_exp_name: "granite_moe3b_sft_40k_ep4_cp8"
  wandb_entity: "bathen"