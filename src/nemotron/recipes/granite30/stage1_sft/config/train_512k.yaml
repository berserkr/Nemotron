# Granite 30B SFT — 512k context, CP=4
#
# Hardware: 64 nodes x 4 GB200 = 256 GPUs
# Parallelism: TP=4, PP=4, CP=4, SP=True
# GPUs/model: 4*4*4 = 64, DP replicas: 4
# 64 layers / PP=4 = 16 layers per pipeline stage
# pad_seq_to_mult = CP * 2 = 8 (required for THD flash-attention)

recipe:
  _target_: megatron.bridge.recipes.granite.granite_30b.granite_30b_finetune_config
  tensor_model_parallel_size: 4
  pipeline_model_parallel_size: 4
  context_parallelism: 4
  sequence_parallelism: true
  seq_length: 524288
  micro_batch_size: 1
  global_batch_size: 32
  finetune_lr: 5.0e-6
  lr_warmup_iters: 50
  train_iters: 1000
  packed_sequence: true

dataset:
  seq_length: 524288
  packed_sft_dir: null
  packed_sequence_specs:
    packed_sequence_size: 524288
    pad_seq_to_mult: 8

train:
  train_iters: 1000
  global_batch_size: 32

checkpoint:
  save: /mnt/vast/proj/checkpoints/bathen/models/nemo_run/granite30b_sft_512k
  load: /mnt/vast/proj/checkpoints/bathen/models/nemo_run/granite30b_sft_512k
  save_interval: 100
  pretrained_checkpoint: /mnt/vast/proj/checkpoints/bathen/models/base/30b-soft-lc-512k-lr1e-4-merged-3-7
  finetune: false
