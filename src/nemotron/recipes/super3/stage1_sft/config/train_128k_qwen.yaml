run: null

recipe:
  _target_: megatron.bridge.recipes.qwen.qwen3_128k.qwen3_8b_cp_validation_config

# --- Overrides to fit 128k at CP=1 ---
model:
  context_parallel_size: 1
  # Critical: Selective recompute will OOM at 128k/CP1. Full is mandatory.
  recompute_granularity: "full"
  recompute_method: "block"
  recompute_num_layers: 1
  sequence_parallel: true
  # Explicitly use Flash Attention for the long sequence
  attention_backend: "flash_attn"

ddp:
  # Critical: Shards optimizer states to save ~50GB of VRAM
  use_distributed_optimizer: true
  overlap_grad_reduce: false
  overlap_param_gather: false

dataset:
  super3_packed_sft_dir: /mnt/vast/proj/checkpoints/bathen/datasets/sft/qwen3_8b_128k/splits
  seq_length: 131072
  packed_sequence_specs:
    packed_sequence_size: 131072
    # For CP=1, this can be 1, but keeping it at 4 or 2 is safe for alignment
    pad_seq_to_mult: 1

train:
  # Reduced for quick validation of your CP fixes
  train_iters: 2000
  eval_interval: 100
  # Keep MBS=1 to minimize peak activation memory
  micro_batch_size: 1
  global_batch_size: 64

scheduler:
  lr_warmup_iters: 50

logger:
  log_interval: 1
  wandb_project: "full_sft_qwen3_8b_128k_validation"
  wandb_exp_name: "cp1_debug_validation_128k-loadedweights"
  wandb_entity: "bathen"

checkpoint:
  save: /mnt/vast/proj/checkpoints/bathen/models/sft/Qwen3-8B-Base-cp1-debug-16nodes-loaded-weights
  save_interval: 250
  pretrained_checkpoint: /mnt/vast/proj/checkpoints/bathen/models/base/Qwen3-8B-Base
  finetune: true